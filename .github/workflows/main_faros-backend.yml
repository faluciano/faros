name: Build and deploy to Azure Container Apps - faros-backend

on:
  push:
    branches:
      - main
    paths:
      - "lighthouse-backend/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: ./lighthouse-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name farosacr

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: farosacr.azurecr.io/faros-backend:${{ github.sha }}
          file: lighthouse-backend/Dockerfile
          context: ./lighthouse-backend
          platforms: linux/amd64

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name faros-backend \
            --resource-group faros \
            --image farosacr.azurecr.io/faros-backend:${{ github.sha }}
